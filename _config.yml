# Jupyter Book configuration
# https://jupyterbook.org/customize/config.html

title: Port notes for scikit-image 1 to 2
author: Matthew Brett
only_build_toc_files: true

execute:
  # The notebooks are MyST Markdown and carry no stored outputs, so every
  # build runs them. The cache keeps unchanged notebooks from re-running.
  execute_notebooks: cache
  timeout: 300

sphinx:
  config:
    # Notebooks are the point of this book; a failure to run one is an error.
    nb_execution_raise_on_error: true
    suppress_warnings: ["mystnb.unknown_mime_type"]

exclude_patterns:
  - _build
  # A gitignored symlink to the scikit-image worktree; Sphinx follows it.
  - .main
  - .main/**
  # Notebooks are the paired .md; the .ipynb would be a duplicate document.
  - "**.ipynb"
  # A gitignored virtualenv in the source directory. Sphinx walks into it and
  # collects package README and licence files as documents, which fails
  # --warningiserror. Incremental builds hide this; a clean build does not.
  - .venv
  - .venv/**
  - README.md
  - AGENTS.md
  - instructions
  - reviews
  - scoring
  - scripts
  - throwaways
  - timing
  - "**.ipynb_checkpoints"

repository:
  url: https://github.com/matthew-brett/scikit-image
  branch: port-notes

html:
  use_issues_button: false
  use_repository_button: true
